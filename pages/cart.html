  <section class="cart-page">
    <h1> Your Cart</h1>

  </section>

  <section class="checkout-form"> 
    <form>
      <div class="input">
        <input type="text" 
        class="name" 
        placeholder="Name" 
        id="name"/>
        <p class="name-msg"> error </p>
      </div>

      <div class="input">
        <input type="email" 
        class="email" 
        placeholder="Email Address" 
        id="email"/>
        <p class="email-msg"> error </p>
      </div>

      <div class="input">
        <input type="number" 
        class="phone-number" 
        placeholder="Phone Number" 
        id="phone-number"/>
        <p class="phone-msg"> error </p>
      </div>

      <div class="input">
        <input type="text" 
        class="address" placeholder="Address" 
        id="address"/>
        <p class="address-msg"> error </p>
      </div>


    </form>
  </section>
